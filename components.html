    <div class="card">
        <header class="cardHeader">CardHeader</header>
        <div class="cardBody">this is a card body</div>
        <div class="cardFooter"> this is a card footer</div>
    </div>




    <div class="component-card">
  <h3>Form Elements</h3>
  <form class="custom-form">
    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" placeholder="Enter your name">
    </div>
    <div class="form-group">
      <label for="country">Country</label>
      <select id="country">
        <option value="">Select country</option>
        <option value="egypt">Egypt</option>
        <option value="usa">USA</option>
        <option value="uk">UK</option>
      </select>
    </div>
    <button type="submit" class="btn-primary">Submit</button>
  </form>
</div>  

<br>
<br>
<br>

<div class="modal-component">
  <label for="modal-toggle" class="btn-open-modal">Open Modal</label>
  <input type="checkbox" id="modal-toggle" class="modal-checkbox">
  <div class="modal-overlay">
    <div class="modal-box">
      <h3>CSS-Only Modal</h3>
      <p>my components site modal </p>
      <label for="modal-toggle" class="btn-close-modal">Close</label>
    </div>
  </div>
</div>





<br>
<br>
<br>
<div class="alert-component">
  <div class="alert alert-success">
    <span class="alert-icon"></span>
    <div class="alert-content">
       Your changes have been saved successfully.
    </div>
  </div>
</div>
