<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="css/contactstyle.css">
</head>
<body>
    <nav>
        <h1>Contact</h1>
        <div id="subHeader">
            <a href="index.html" class="nonCurrentPage">home</a>
            <a href="about.html" class="nonCurrentPage">about</a>
            <a href="components.html" class="nonCurrentPage">components</a>
            <a href="contact.html" class="currentPage">contact</a>
        </div>
    </nav>
    <main>
        <div id="inMain">
            <h2>Registeration</h2>
        </div>
        <form>
            <pre> Username  </pre>
            <input type="text" required autofocus>
            <br>
            <br>
            <pre> Password  </pre>
            <input type="password" required>
            <br>
            <br>
            <pre> Email     </pre>
            <input type="email" required>
            <br>
            <br>
            <pre> Age       </pre>
            <input type="number" required>
            <br>
            <br>
            <pre> birthday          </pre>
            <input type="date" required> 
            <br>
            <br>
            <pre> select a country        </pre>
            <select name="country">
                <optgroup label="Africa">
                    <option value="eg">Egypt</option>
                    <option value="sud">Sudan</option>
                    <option value="lib">Libia</option>
                </optgroup>
                <optgroup label="Asia">
                    <option value="jap">Egypt</option>
                    <option value="cn">Sudan</option>
                </optgroup>
                <optgroup label="North America">
                    <option value="us">USA</option>
                    <option value="Can">Canda</option>
                    <option value="lib">Mexico</option>
                </optgroup>
            </select>
            <br>
            <br>
            <pre> are you single ?                 </pre>
            <input type="checkbox" required>
            <br>
            <br>
            <pre> you agree our policy ?       </pre>
            <input type="radio" value="Yes" name="x" id="i1">
            <label for="i1">Yes</label>
            <br>
            <pre>                              </pre>
            <input type="radio" value="No" name="x">
            <label for="i1">No</label>
            <br>
            <br>
            <pre>       </pre>
            <textarea cols="40" rows="5" placeholder="a note you might want to add"></textarea>
            <br>
            <br>
            <pre>                       </pre>
            <input type="submit" id="subm">
        </form>
    </main>
</body>
</html>
